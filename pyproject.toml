[project]
name = "slimclaw"
version = "0.0.1"
description = "Personal Claude assistant accessible via WhatsApp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ganeshan Malhotra", email = "ganeshan007@gmail.com" },
]
keywords = ["claude", "whatsapp", "assistant", "ai", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "neonize>=0.3.14",
    "croniter>=2.0",
    "structlog>=24.0",
    "pydantic>=2.0",
    "qrcode>=7.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/ganeshan007/slimclaw"
Repository = "https://github.com/ganeshan007/slimclaw"
Issues = "https://github.com/ganeshan007/slimclaw/issues"

[project.scripts]
slimclaw = "slimclaw.main:run"
slimclaw-auth = "slimclaw.whatsapp_auth:run"
slimclaw-setup = "slimclaw.setup_cli:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slimclaw = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
