[project]
name = "slimclaw"
version = "1.0.0"
description = "Personal Claude assistant - Python port"
requires-python = ">=3.11"
dependencies = [
    "neonize>=0.3.14",
    "croniter>=2.0",
    "structlog>=24.0",
    "pydantic>=2.0",
    "qrcode>=7.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
slimclaw = "slimclaw.main:run"
slimclaw-auth = "slimclaw.whatsapp_auth:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
